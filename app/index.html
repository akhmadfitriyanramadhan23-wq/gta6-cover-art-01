<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover — make your own GTA-style poster</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Vice Cover</h1>
    <p class="tagline">Your photo, a caption, a poster. Photos never leave this machine.</p>

    <fieldset>
      <legend>Layout</legend>
      <label>Panels
        <select id="layout">
          <option value="poster">Poster — hero + two small</option>
          <option value="triptych">Triptych — three tall panels</option>
          <option value="single">Single — one full photo</option>
        </select>
      </label>
      <label>Colour grade
        <select id="grade">
          <option value="sunset">Sunset</option>
          <option value="neon">Neon nights</option>
          <option value="dusk">Vice dusk</option>
        </select>
      </label>
    </fieldset>

    <fieldset>
      <legend>Words</legend>
      <label>Caption
        <input id="caption" type="text" maxlength="40" value="Sunset Heist">
      </label>
      <label>Small line above it
        <input id="subline" type="text" maxlength="40" value="Neon Boulevard">
      </label>
    </fieldset>

    <fieldset>
      <legend>Photo in the selected panel</legend>
      <div id="panel-tabs" class="tabs" role="group" aria-label="Choose a panel"></div>
      <div class="row">
        <button id="sample-pier" type="button" data-sample="pier">Pier sample</button>
        <button id="sample-boulevard" type="button" data-sample="boulevard">Boulevard sample</button>
      </div>
      <label class="upload">Upload your own photo
        <input id="upload" type="file" accept="image/*">
      </label>
      <button id="use-everywhere" type="button">Use this photo in every panel</button>
      <label>Zoom <span id="zoom-value">1.00×</span>
        <input id="zoom" type="range" min="1" max="3" step="0.05" value="1">
      </label>
      <label>Move left / right
        <input id="shift-x" type="range" min="-0.6" max="0.6" step="0.01" value="0">
      </label>
      <label>Move up / down
        <input id="shift-y" type="range" min="-0.6" max="0.6" step="0.01" value="0">
      </label>
      <p class="hint">Tip: click a panel to pick it, drag its photo to move it, scroll over it to zoom.</p>
    </fieldset>

    <fieldset>
      <legend>Export</legend>
      <div class="row wrap">
        <button type="button" data-size data-w="1080" data-h="1080">Square</button>
        <button type="button" data-size data-w="1080" data-h="1350">Portrait</button>
        <button type="button" data-size data-w="1920" data-h="1080">Wide</button>
      </div>
      <button id="export-square" class="primary" type="button" data-export data-w="1080" data-h="1080">Export PNG · 1080 × 1080</button>
      <button id="export-portrait" class="primary" type="button" data-export data-w="1080" data-h="1350">Export PNG · 1080 × 1350</button>
      <button id="export-wide" class="primary" type="button" data-export data-w="1920" data-h="1080">Export PNG · 1920 × 1080</button>
      <p id="status" role="status"></p>
    </fieldset>
  </section>
  <section class="stage" aria-label="Live preview">
    <canvas id="preview" width="900" height="900" aria-label="The cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
